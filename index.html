<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0e10" />
  <title>PRISM — ясно. просто. твоё.</title>
  <!-- Без Google Fonts: в Telegram WebView они часто вешают загрузку -->
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* страховка: сплэш сам исчезнет, даже если JS упал */
    .splash { animation: splashAutoHide 0.01s ease 1.1s forwards; }
    @keyframes splashAutoHide {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }
  </style>
  <script src="telegram-web-app.js"></script>
  <script>
    // если SDK не поднялся — заглушка, иначе Telegram крутит вечный лоадер
    (function () {
      if (!window.Telegram) window.Telegram = {};
      if (!window.Telegram.WebApp) {
        window.Telegram.WebApp = {
          ready: function () {},
          expand: function () {},
          close: function () {},
          setHeaderColor: function () {},
          setBackgroundColor: function () {},
          initData: "",
          initDataUnsafe: {},
          version: "0",
          platform: "unknown"
        };
      }
      try { window.Telegram.WebApp.ready(); } catch (e) {}
      try { window.Telegram.WebApp.expand(); } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="stage">
    

    <div class="device">
      <div class="device-bg"></div>
      <div class="metal-edge"></div>

      <!-- SPLASH -->
      <div class="splash" id="splash">
        <div class="splash-mark">
          <svg viewBox="0 0 64 64" class="mark-svg lg"><use href="#prism-mark"/></svg>
        </div>
        <div class="splash-time mono" id="splash-time">00:00</div>
        <div class="splash-sub mono">PRISM</div>
        <div class="splash-motto">ясно из шума</div>
      </div>

      <header class="tg-bar">
        <div class="tg-left">
          <span class="tg-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" class="mark-svg sm"><use href="#prism-mark"/></svg>
          </span>
          <div>
            <div class="tg-name">PRISM</div>
            <div class="tg-sub" id="tg-sub"></div>
          </div>
        </div>
        <div class="tg-right mono" id="clock">—</div>
      </header>

      <div class="viewport">
        <section class="view active" id="view-input" data-view="input">
          <textarea id="raw-input" rows="9" placeholder="Вставь сюда сообщение или переписку"></textarea>

          <button type="button" class="btn primary block" id="btn-run" disabled>Разобрать</button>
          <button type="button" class="linkish sub" id="btn-clipboard">Вставить из буфера</button>

          <div class="foot-links">
            <button type="button" class="linkish" data-mode="vault">Заметки</button>
          </div>
        </section>

        <section class="view" id="view-process" data-view="process">
          <div class="process-center">
            <div class="process-mark">
              <svg viewBox="0 0 64 64" class="mark-svg md"><use href="#prism-mark"/></svg>
            </div>
            <p class="process-title mono" id="process-title">REFRACT</p>
            <p class="process-line" id="process-line">Преломляю поток…</p>
          </div>
        </section>

        <section class="view" id="view-queue" data-view="queue">
          <div class="result-top">
            <button type="button" class="linkish" id="btn-back-q">← Назад</button>
          </div>
          <p class="q-count" id="q-count">—</p>
          <div id="q-list"></div>
          <p class="q-tail" id="q-tail"></p>
        </section>

        <section class="view" id="view-result" data-view="result">
          <div class="result-top">
            <button type="button" class="linkish" id="btn-back">← Назад</button>
          </div>

          <div class="verdict" id="priority-banner">
            <span class="dot"></span><span id="p-name">Не срочно</span>
          </div>

          <p id="need-text" class="need">—</p>

          <div class="flags" id="flags"></div>

          <pre id="reply-text" class="reply-pre">—</pre>

          <button type="button" class="btn primary block" id="btn-copy-reply">Скопировать ответ</button>
          <button type="button" class="linkish sub" id="btn-save">Сохранить</button>
        </section>

        <section class="view" id="view-vault" data-view="vault">
          <div class="vault-head">
            <h2 class="screen-h">Заметки</h2>
            <p class="dim-text">Простой поиск. «Ещё нужно?» — без Obsidian.</p>
          </div>
          <input type="search" id="vault-search" class="search" placeholder="Найти…" />
          <div class="vault-filters" id="vault-filters">
            <button type="button" class="chip active" data-filter="all">Все</button>
            <button type="button" class="chip" data-filter="work">Работа</button>
            <button type="button" class="chip" data-filter="personal">Личка</button>
            <button type="button" class="chip" data-filter="news">Новости</button>
            <button type="button" class="chip" data-filter="docs">Доки</button>
          </div>
          <div id="vault-list" class="vault-list"></div>
          <p class="fine mono" id="vault-empty">Пусто. Сделай ясно → «Сохранить в заметки».</p>
        </section>
      </div>
    </div>
  </div>

  <!-- Shared geometric mark (not a letter) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0f3f5"/>
        <stop offset="38%" stop-color="#c3cbd2"/>
        <stop offset="70%" stop-color="#8b949c"/>
        <stop offset="100%" stop-color="#d9c6a4"/>
      </linearGradient>
      <linearGradient id="inkEdge" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0d0e10" stop-opacity="0.3"/>
        <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#d9c6a4" stop-opacity="0.45"/>
      </linearGradient>
      <symbol id="prism-mark" viewBox="0 0 64 64">
        <path fill="url(#stoneGrad)" d="M32 6 L56 50 L40 50 L32 36 L24 50 L8 50 Z"/>
        <path fill="url(#inkEdge)" d="M32 6 L40 50 L32 36 Z" opacity="0.5"/>
        <path stroke="#0d0e10" stroke-width="1.15" fill="none" opacity="0.32" d="M28 28 L18 48"/>
        <path stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5" d="M32 22 L32 48"/>
        <path stroke="#d9c6a4" stroke-width="1.15" fill="none" opacity="0.6" d="M36 28 L46 48"/>
      </symbol>
    </defs>
  </svg>

  <div class="toast hidden" id="toast"></div>
  <script src="queue.js" defer></script>
  <script src="app.js" defer></script>
  <script>
    // всегда убрать сплэш (если app.js не дошёл)
    setTimeout(function () {
      var el = document.getElementById("splash");
      if (el) el.classList.add("gone");
    }, 900);
  </script>
</body>
</html>
